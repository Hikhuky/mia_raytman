<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mia Raytman (@.rtm) | Bio Link</title>
  <meta name="description" content="Mia Raytman — 19 y.o., USC, Los Angeles. Bio, dance archives & mood diary.">
  
  <!-- Favicon -->

  <!-- Google Fonts: Syne & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ===================================================================
       THEME: DARK BURGUNDY & VELVET NOIR
       Tailored for Mia Raytman (@.rtm)
       =================================================================== */
    :root {
      /* ── Burgundy Palette ── */
      --primary-color: #a82846;       /* Deep rich burgundy */
      --primary-hover: #c43358;       /* Glowing berry */
      --primary-subtle: rgba(168, 40, 70, 0.25);
      --accent-glow: rgba(196, 51, 88, 0.4);
      --rose-gold: #e2a8b2;           /* Rose gold soft accent */

      /* ── Background & Canvas ── */
      --page-bg: #0c0407;
      --mesh-color-1: #3b0713;
      --mesh-color-2: #21030b;
      --mesh-color-3: #4a0d1b;

      /* ── Glassmorphism Card ── */
      --card-bg: rgba(24, 7, 13, 0.72);
      --card-border: rgba(226, 168, 178, 0.18);
      --card-blur: 24px;

      /* ── Buttons & Links ── */
      --btn-bg: rgba(255, 255, 255, 0.04);
      --btn-border: rgba(226, 168, 178, 0.14);
      --btn-hover-bg: rgba(168, 40, 70, 0.25);
      --btn-hover-border: rgba(226, 168, 178, 0.55);
      --btn-text: #fff5f6;

      /* ── Typography Colors ── */
      --text-main: #fff0f2;
      --text-muted: #c9a4ac;
      --text-subtle: #7a545c;

      /* ── Shadows & Radii ── */
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 28px;
      --radius-full: 9999px;
      --shadow-card: 0 24px 50px -10px rgba(0, 0, 0, 0.85), 0 0 45px rgba(168, 40, 70, 0.18);
      --shadow-btn: 0 4px 16px rgba(0, 0, 0, 0.35);
      --transition-base: 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      background-color: var(--page-bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px 16px;
      position: relative;
      overflow-x: hidden;
      line-height: 1.5;
    }

    /* Ambient Background Mesh */
    .bg-mesh {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .mesh-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.65;
      animation: float 20s ease-in-out infinite alternate;
    }

    .mesh-1 {
      width: 520px;
      height: 520px;
      background: var(--mesh-color-1);
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
    }

    .mesh-2 {
      width: 440px;
      height: 440px;
      background: var(--mesh-color-2);
      bottom: -80px;
      left: 5%;
      animation-duration: 24s;
    }

    .mesh-3 {
      width: 360px;
      height: 360px;
      background: var(--mesh-color-3);
      top: 45%;
      right: 5%;
      animation-duration: 28s;
    }

    @keyframes float {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(30px) scale(1.1); }
    }

    /* Main Container Card */
    .profile-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 490px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(var(--card-blur));
      -webkit-backdrop-filter: blur(var(--card-blur));
      border-radius: var(--radius-lg);
      padding: 44px 28px 36px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: cardAppear 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(22px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Top Action Bar (Share) */
    .top-actions {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 10;
    }

    .icon-button {
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--text-muted);
      width: 40px;
      height: 40px;
      border-radius: var(--radius-full);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition-base);
      outline: none;
    }

    .icon-button:hover, .icon-button:active {
      background: var(--primary-subtle);
      color: var(--text-main);
      transform: scale(1.1);
      border-color: var(--btn-hover-border);
      box-shadow: 0 0 16px var(--accent-glow);
    }

    /* Header & Centered Avatar */
    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      text-align: center;
    }

    .avatar-wrapper {
      position: relative;
      width: 114px;
      height: 114px;
      margin: 0 auto 18px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .avatar-glow {
      position: absolute;
      inset: -4px;
      background: linear-gradient(135deg, var(--primary-color), var(--rose-gold));
      border-radius: var(--radius-full);
      filter: blur(10px);
      opacity: 0.65;
      transition: opacity var(--transition-base);
    }

    .avatar-wrapper:hover .avatar-glow {
      opacity: 0.95;
      filter: blur(14px);
    }

    .avatar-img {
      position: relative;
      width: 114px;
      height: 114px;
      border-radius: var(--radius-full);
      object-fit: cover;
      object-position: center 25%;
      border: 2px solid rgba(255, 240, 242, 0.4);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
      transition: transform var(--transition-base);
      display: block;
    }

    .avatar-wrapper:hover .avatar-img {
      transform: scale(1.03);
    }

    .status-badge {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 16px;
      height: 16px;
      background-color: #10b981;
      border: 3px solid var(--page-bg);
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.7);
      z-index: 2;
    }

    /* Profile Identity */
    .profile-name {
      font-family: 'Syne', sans-serif;
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
      letter-spacing: -0.01em;
    }

    .profile-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .profile-handle {
      font-size: 0.95rem;
      color: var(--rose-gold);
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 0.02em;
    }

    .info-pill {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      padding: 3px 10px;
      border-radius: var(--radius-full);
      letter-spacing: 0.02em;
    }

    .profile-bio {
      font-size: 0.92rem;
      color: var(--text-muted);
      max-width: 400px;
      margin-bottom: 22px;
      line-height: 1.6;
    }

    /* ===================================================================
       PURE NATIVE AUDIO PLAYER CARD (California Gurls)
       Clean, aesthetic & 100% video-free!
       =================================================================== */
    .music-player-card {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      margin-bottom: 24px;
      background: linear-gradient(135deg, rgba(59, 7, 19, 0.55) 0%, rgba(20, 5, 10, 0.7) 100%);
      border: 1px solid rgba(226, 168, 178, 0.22);
      border-radius: var(--radius-md);
      text-align: left;
      cursor: pointer;
      user-select: none;
      transition: all var(--transition-base);
    }

    .music-player-card:hover {
      border-color: rgba(226, 168, 178, 0.55);
      box-shadow: 0 8px 24px var(--accent-glow);
      transform: translateY(-2px);
    }

    .player-thumb-wrapper {
      position: relative;
      width: 52px;
      height: 52px;
      flex-shrink: 0;
    }

    .player-thumb {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.25);
      display: block;
    }

    .play-overlay-btn {
      position: absolute;
      inset: 0;
      background: rgba(12, 4, 7, 0.45);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      transition: all var(--transition-base);
    }

    .music-player-card:hover .play-overlay-btn {
      background: rgba(168, 40, 70, 0.6);
      transform: scale(1.05);
    }

    .player-details {
      flex: 1;
      min-width: 0;
    }

    .player-status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2px;
    }

    .player-badge {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--rose-gold);
      font-weight: 700;
    }

    .player-song {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-artist {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* Soundwave Graphic */
    .soundwave {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 16px;
    }

    .soundwave-bar {
      width: 3px;
      background-color: var(--rose-gold);
      border-radius: 2px;
      height: 6px;
      transition: transform 0.2s ease;
    }

    .playing .soundwave-bar {
      animation: soundwaveBounce 1.1s ease-in-out infinite alternate;
    }

    .playing .soundwave-bar:nth-child(1) { height: 6px; animation-delay: 0.1s; }
    .playing .soundwave-bar:nth-child(2) { height: 16px; animation-delay: 0.3s; }
    .playing .soundwave-bar:nth-child(3) { height: 10px; animation-delay: 0.2s; }
    .playing .soundwave-bar:nth-child(4) { height: 14px; animation-delay: 0.4s; }

    @keyframes soundwaveBounce {
      0% { transform: scaleY(0.4); opacity: 0.5; }
      100% { transform: scaleY(1.15); opacity: 1; }
    }

    .player-toggle-btn {
      background: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 7px 16px;
      border-radius: var(--radius-full);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all var(--transition-base);
      flex-shrink: 0;
    }

    .player-toggle-btn:hover {
      background: var(--primary-hover);
      box-shadow: 0 0 16px var(--accent-glow);
      transform: scale(1.05);
    }

    /* Social Icons Row */
    .social-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 28px;
      width: 100%;
    }

    .social-btn {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-full);
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all var(--transition-base);
    }

    .social-btn:hover {
      background: var(--primary-color);
      color: #ffffff;
      border-color: transparent;
      transform: translateY(-3px) scale(1.08);
      box-shadow: 0 8px 20px var(--accent-glow);
    }

    .social-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Links List */
    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 30px;
    }

    .link-item {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 56px;
      padding: 14px 20px;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: var(--radius-md);
      color: var(--btn-text);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      box-shadow: var(--shadow-btn);
      transition: all var(--transition-base);
      cursor: pointer;
    }

    .link-content {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
    }

    .link-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      color: var(--rose-gold);
      flex-shrink: 0;
      transition: transform var(--transition-base);
    }

    .link-title {
      flex: 1;
      text-align: left;
    }

    .link-arrow {
      color: var(--text-subtle);
      transition: all var(--transition-base);
      flex-shrink: 0;
    }

    .link-item:hover {
      background: var(--btn-hover-bg);
      border-color: var(--btn-hover-border);
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4), 0 0 20px var(--accent-glow);
    }

    .link-item:hover .link-icon {
      transform: scale(1.15);
      color: #ffffff;
    }

    .link-item:hover .link-arrow {
      color: var(--text-main);
      transform: translateX(4px);
    }

    /* Featured Link */
    .link-item.featured {
      background: linear-gradient(135deg, rgba(168, 40, 70, 0.35) 0%, rgba(68, 11, 23, 0.45) 100%);
      border: 1px solid rgba(226, 168, 178, 0.4);
      box-shadow: 0 8px 24px rgba(168, 40, 70, 0.25);
    }

    .link-item.featured::before {
      content: 'FEATURED ✨';
      position: absolute;
      top: -9px;
      right: 18px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 2px 9px;
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
      color: #ffffff;
      box-shadow: 0 2px 10px var(--accent-glow);
    }

    /* Footer */
    .footer {
      font-size: 0.8rem;
      color: var(--text-subtle);
      margin-top: auto;
      letter-spacing: 0.02em;
    }

    /* Toast Notification (Reliable Popup) */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(30px);
      background: rgba(30, 8, 16, 0.96);
      border: 1px solid var(--rose-gold);
      color: #ffffff;
      padding: 12px 24px;
      border-radius: var(--radius-full);
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7), 0 0 20px var(--accent-glow);
      backdrop-filter: blur(12px);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    @media (max-width: 480px) {
      body {
        padding: 18px 12px;
      }
      .profile-card {
        padding: 36px 18px 26px;
        border-radius: var(--radius-md);
      }
      .avatar-wrapper {
        width: 104px;
        height: 104px;
      }
      .avatar-img {
        width: 104px;
        height: 104px;
      }
      .profile-name {
        font-size: 1.45rem;
      }
    }
  </style>
</head>
<body>

  <!-- Native HTML5 Audio Player (Zero YouTube dependencies, plays local audio file) -->
  <audio id="bgAudio" loop preload="auto">

  <!-- Background Mesh Blobs -->

  <!-- Main Card -->
  <main class="profile-card">

            <span class="soundwave-bar"></span>

          </div>
        </div>
        <div class="player-song">California Gurls 🌴</div>
        <div class="player-artist">Katy Perry ft. Snoop Dogg</div>

      <button class="player-toggle-btn" id="playerToggleBtn" type="button">
        Play

    <!-- Social Media Row (Spotify & Pinterest reserved for future) -->
    <section class="social-links" id="socialLinksContainer" aria-label="Social profiles"></section>

    <!-- Bio Links -->
    <section class="links-list" id="linksContainer" aria-label="Bio links"></section>

    <!-- Footer -->
    <footer class="footer" id="footerContainer"></footer>
  </main>

  <!-- Toast Notification -->
  <div id="toast" class="toast" role="alert" aria-live="polite">
    <span>✨ Profile link copied to clipboard!</span>
  </div>

  <!-- ===================================================================
       JAVASCRIPT CONFIGURATION & NATIVE SOUND ENGINE
       =================================================================== -->

    /* =================================================================

    /* =================================================================
       RENDER ENGINE
       ================================================================= */
    function renderBioLink(data) {
      // 1. Socials
      const socialsContainer = document.getElementById("socialLinksContainer");
      socialsContainer.innerHTML = "";
      data.socials.forEach(social => {
        const a = document.createElement("a");
        a.className = "social-btn";
        a.href = social.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.setAttribute("aria-label", social.label || social.platform);
        a.title = social.label || social.platform;
        a.innerHTML = ICONS[social.platform.toLowerCase()] || "";
        socialsContainer.appendChild(a);
      });

      // 2. Links
      const linksContainer = document.getElementById("linksContainer");
      linksContainer.innerHTML = "";
      data.links.forEach(link => {
        const a = document.createElement("a");
        a.className = `link-item ${link.featured ? "featured" : ""}`;
        a.href = link.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";

        const iconSvg = ICONS[link.icon] || ICONS.sparkles;

        a.innerHTML = `
          <div class="link-content">
            <span class="link-icon">${iconSvg}</span>
            <span class="link-title">${link.title}</span>
          </div>
          <span class="link-arrow">${ICONS.arrowRight}</span>
        `;
        linksContainer.appendChild(a);
      });

      // 3. Footer
      document.getElementById("footerContainer").innerHTML = data.footerText;
    }

    /* =================================================================
       NATIVE AUDIO PLAYER ENGINE (Plays ./music.mp3 directly!)
       Zero YouTube blocks, pure audio file playback!
       ================================================================= */
    let isAudioPlaying = false;
    const bgAudio = document.getElementById("bgAudio");
    const musicPlayer = document.getElementById("musicPlayer");
    const svgPlay = document.getElementById("svgPlay");
    const svgPause = document.getElementById("svgPause");
    const playerStatusText = document.getElementById("playerStatusText");
    const playerToggleBtn = document.getElementById("playerToggleBtn");

    // Comfortable listening volume
    bgAudio.volume = 0.45;

    function togglePlayback() {
      if (isAudioPlaying) {
        pauseAudio();
      } else {
        playAudio();
      }
    }

    function playAudio() {
      const playPromise = bgAudio.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          isAudioPlaying = true;
          musicPlayer.classList.add("playing");
          svgPlay.style.display = "none";
          svgPause.style.display = "block";
          playerStatusText.textContent = "⏸ Playing...";
          playerToggleBtn.textContent = "Pause";
        }).catch(err => {
          console.log("Audio play gesture required:", err);
        });
      }
    }

    function pauseAudio() {
      isAudioPlaying = false;
      bgAudio.pause();
      musicPlayer.classList.remove("playing");
      svgPlay.style.display = "block";
      svgPause.style.display = "none";
      playerStatusText.textContent = "▶ Tap to play";
      playerToggleBtn.textContent = "Play";
    }

    musicPlayer.addEventListener("click", togglePlayback);
    playerToggleBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      togglePlayback();
    });

    // Auto-play softly on first tap anywhere
    let firstInteraction = false;
    function handleFirstUserTap() {
      if (!firstInteraction) {
        firstInteraction = true;
        if (!isAudioPlaying) {
          playAudio();
        }
      }
    }
    document.addEventListener("click", handleFirstUserTap, { once: true });
    document.addEventListener("touchstart", handleFirstUserTap, { once: true });

    /* =================================================================
       SHARE & CLIPBOARD (100% Reliable in all browsers)
       ================================================================= */
    function showToast(text) {
      const toast = document.getElementById("toast");
      if (text) toast.querySelector("span").textContent = text;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2800);
    }

    function copyToClipboard(textToCopy) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(textToCopy).then(() => {
          showToast("✨ Profile link copied to clipboard!");
        }).catch(() => {
          fallbackCopyText(textToCopy);
        });
      } else {
        fallbackCopyText(textToCopy);
      }
    }

    function fallbackCopyText(text) {
      try {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.left = "-9999px";
        textArea.style.top = "-9999px";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        const success = document.execCommand("copy");
        document.body.removeChild(textArea);
        if (success) {
          showToast("✨ Profile link copied to clipboard!");
        } else {
          prompt("Copy this profile link:", text);
        }
      } catch (err) {
        prompt("Copy this profile link:", text);
      }
    }

    document.getElementById("shareBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      const currentUrl = window.location.href;

      if (navigator.share && window.location.protocol.startsWith("http")) {
        navigator.share({
          title: "Mia Raytman (@.rtm)",
          text: "19, USC freshman in Los Angeles. Living at my own pace :)",
          url: currentUrl
        }).catch(() => {
          copyToClipboard(currentUrl);
        });
      } else {
        copyToClipboard(currentUrl);
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      renderBioLink(userData);
    });
